<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="EWT.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWT Technology</title>
    <!-- Links to your new external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-container">
    <button onclick="openSidebar()" class="menu-btn">☰ Menu</button>
    <div class="logo-center">
        <img src="EWT.png" alt="EWT Logo" style="width: 50px; height: auto;">
    </div>
    <a href="javascript:void(0)" onclick="openCart()" class="cart-btn">🛒 Cart</a>
</div>

<div id="sidebar" class="sidebar">
    <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">&times;</a>
    <a href="#" onclick="filterProducts('all'); closeSidebar();">🏠 Home</a>
    <a href="#" onclick="filterProducts('all'); closeSidebar();">📦 Products</a>
    <a href="#" onclick="filterProducts('custom'); closeSidebar();">🖥️ Custom PC</a>
    <hr>
    <a href="profilePage.html" onclick="showProfile(); closeSidebar();">👤 My Account</a>
    <a href="#" onclick="logout(); closeSidebar();">🚪 Logout</a>
    <a href="#" onclick="showLogin(); closeSidebar();">🔑 Login</a>
    <a href="#" onclick="showRegister(); closeSidebar();">📝 Register</a>
</div>

<div class="hero">
    <h1>SOMETHING INTERESTING</h1>
    <p>🐱 hi hi hi i love cats, calico cats 🐱</p>
</div>

<div class="categories">
    <button class="category" onclick="filterProducts('all')">All</button>
    <button class="category" onclick="filterProducts('pc')">PC</button>
    <button class="category" onclick="filterProducts('laptop')">Laptop</button>
    <button class="category" onclick="filterProducts('phone')">Phones</button>
    <button class="category" onclick="filterProducts('custom')">Custom PC</button>
</div>

<div class="products" id="productsGrid"></div>

<div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
        <h3>My Cart</h3>
        <span class="close-cart" onclick="closeCart()">&times;</span>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total" id="cartTotal"></div>
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<footer>
    <p>&copy; 2024 EWT Technology. All rights reserved.</p>
</footer>

<!-- Links to your new external JavaScript file -->
<script src="script.js"></script>
</body>
</html>
