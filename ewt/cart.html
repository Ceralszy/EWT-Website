<!DOCTYPE html>
<html>
    <head> 
        <meta charset="UTF-8">
        <title>EWT Technology - Cart</title> 
        <link rel="stylesheet" href="CSSStyle1.css">
        <link rel="icon" type="image/png" href="EWT.png">
        <style>
            /* THE MISSING SIDEBAR CSS */
            .sidebar {
                height: 100%;
                width: 0; /* Hidden by default */
                position: fixed; /* Stays in place when scrolling */
                z-index: 9999; /* Sits on top of everything */
                top: 0;
                left: 0;
                background-color: #213555; /* The EWT Blue */
                overflow-x: hidden; /* Prevents horizontal scroll */
                padding-top: 60px;
                transition: 0.4s ease; /* The smooth slide animation */
                box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            }
            
            .sidebar a {
                padding: 15px 20px 15px 30px;
                text-decoration: none;
                font-size: 1.2em;
                color: #ffffff;
                display: block;
                transition: 0.2s;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }

            .sidebar a:hover {
                background-color: rgba(255,255,255,0.1);
            }

            .sidebar .close-btn {
                position: absolute;
                top: 10px;
                right: 20px;
                font-size: 36px;
                border-bottom: none;
                padding: 0;
            }

            .sidebar hr {
                border: 0;
                height: 1px;
                background: rgba(255,255,255,0.2);
                margin: 10px 0;
            }
        </style>
    </head>
    
    <body>
        <div id="sidebar" class="sidebar">
            <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">&times;</a>
            <a href="index.html">🏠 Home</a>
            <a href="index.html">📦 Products</a>
            <a href="index.html">🖥️ Custom PC</a>
            <hr>
            <a href="profilePage.html">👤 My Account</a>
            <a href="#" onclick="alert('Logged out'); closeSidebar();">🚪 Logout</a>
            <a href="#" onclick="alert('To be continued^^'); closeSidebar();">🔑 Login</a>
            <a href="#" onclick="alert('Blum connect lgi :P'); closeSidebar();">📝 Register</a>
        </div>

        <div class="website">
            
            <div class="nav-bar">
                <div class="menu-container" onclick="openSidebar()" style="cursor: pointer;">
                    <div class="hamburger-option">
                        <div class="line"></div> 
                        <div class="line"></div>
                        <div class="line"></div>
                     </div>
                     <div class="shortText" style="cursor: pointer;">Menu</div>
                </div>
                
                <div class="EWT">
                    <a href="index.html" class="link"></a>
                </div>
                
                <div class="Social-Medias">
                    <a href="#" class="whatsapp"></a>
                    <a href="#" class="facebook"></a>
                    <a href="#" class="instagram"></a>        
                </div>
            </div>

            <main class="cart-container">
                <div class="cart-wrapper">
                    <h1 class="cart-title">Your cart</h1>
                    
                    <table class="cart-table" id="cartTable">
                        <thead>
                            <tr>
                                <th class="col-product">Product</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="fullCartBody">
                            </tbody>
                    </table>

                    <div id="empty-state" class="empty-state-container" style="display: none; text-align: center; padding: 60px 20px;">
                        <p style="font-size: 1.5em; color: #555; margin-bottom: 25px; font-weight: 500;">Your cart is empty</p>
                        <button class="btn-secondary" onclick="window.location.href='index.html'" style="
                            background-color: #eee;
                            color: #333;
                            border: none;
                            padding: 12px 30px;
                            font-size: 1em;
                            font-weight: bold;
                            border-radius: 5px;
                            cursor: pointer;
                            transition: background 0.2s ease-in-out;
                        " onmouseover="this.style.backgroundColor='#ddd';" onmouseout="this.style.backgroundColor='#eee';">
                         Continue shopping
                        </button>
                    </div>

                    <div class="cart-total-section" id="cartTotalSection">
                        <span class="total-label">Total :</span>
                        <span class="total-amount" id="fullCartTotal">RM 0</span>
                    </div>
                </div>

                <div class="cart-action-buttons" id="cartActionButtons">
                    <button class="btn-secondary" onclick="window.location.href='index.html'">Continue shopping</button>
                    <button class="btn-primary" onclick="processFinalCheckout()">Proceed to checkout</button>
                </div>
            </main>

        </div> 

        <script>
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            function renderFullCart() {
                const tbody = document.getElementById('fullCartBody');
                const totalSpan = document.getElementById('fullCartTotal');
                const emptyState = document.getElementById('empty-state');
                const cartTable = document.getElementById('cartTable');
                const totalSection = document.getElementById('cartTotalSection');
                const actionButtons = document.getElementById('cartActionButtons');
                
                if (cart.length === 0) {
                    cartTable.style.display = 'none';
                    totalSection.style.display = 'none';
                    actionButtons.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                cartTable.style.display = 'table';
                totalSection.style.display = 'block'; 
                actionButtons.style.display = 'flex'; 
                emptyState.style.display = 'none';

                let total = 0;
                
                tbody.innerHTML = cart.map((item, index) => {
                    const subtotal = item.price * item.quantity;
                    total += subtotal;
                    
                    return `
                        <tr>
                            <td class="col-product" style="display: flex; align-items: center; gap: 15px;">
                                <img src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=100';" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                                <span class="product-name">${item.name}</span>
                            </td>
                            <td>RM ${item.price.toLocaleString()}</td>
                            <td>
                                <div class="quantity-controls" style="display: flex; align-items: center; gap: 10px;">
                                    <button class="qty-btn" onclick="updateQty(${index}, -1)" style="padding: 5px 10px; cursor: pointer;">-</button>
                                    <input type="text" value="${item.quantity}" readonly class="qty-input" style="width: 40px; text-align: center;">
                                    <button class="qty-btn" onclick="updateQty(${index}, 1)" style="padding: 5px 10px; cursor: pointer;">+</button>
                                </div>
                            </td>
                            <td>RM ${subtotal.toLocaleString()}</td>
                            <td>
                                <button onclick="removeItem(${index})" style="background:none; border:none; color:#e2312b; cursor:pointer; font-size: 1.5em; font-weight: bold;">&times;</button>
                            </td>
                        </tr>
                    `;
                }).join('');
                
                totalSpan.textContent = `RM ${total.toLocaleString()}`;
            }

            function updateQty(index, change) {
                cart[index].quantity += change;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1); 
                }
                localStorage.setItem('cart', JSON.stringify(cart)); 
                renderFullCart(); 
            }

            function removeItem(index) {
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                renderFullCart();
            }

            function processFinalCheckout() {
                if(cart.length === 0) return;
                window.location.href = 'checkout.html'; 
            }

            window.addEventListener('storage', function(event) {
                if (event.key === 'cart') {
                    cart = JSON.parse(event.newValue) || [];
                    renderFullCart();
                }
            });

            renderFullCart();
            
            // Sidebar Control Functions
            function openSidebar() { 
                 document.getElementById("sidebar").style.width = "280px"; 
            }

            function closeSidebar() { 
                 document.getElementById("sidebar").style.width = "0"; 
            }
        </script>
    </body>
</html>
