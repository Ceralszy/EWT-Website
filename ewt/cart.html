<!DOCTYPE html>
<html>
    <head> 
        <meta charset="UTF-8">
        <title>EWT Technology - Cart</title> 
        <link rel="stylesheet" href="CSSStyle1.css">
        <link rel="icon" type="image/png" href="EWT.png">
    </head>
    
    <body>
        <div class="website">
            
            <div class="nav-bar">
                <div class="menu-container">
                    <div class="hamburger-option" onclick="window.location.href='index.html'">
                        <div class="line"></div> 
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                    <div class="shortText">Menu</div>
                </div>
                
                <div class="EWT">
                    <a href="index.html" class="link"></a>
                </div>
                
                <div class="Social-Medias">
                    <a href="#" class="whatsapp"></a>
                    <a href="#" class="facebook"></a>
                    <a href="#" class="instagram"></a>        
                </div>
            </div>

            <main class="cart-container">
                <div class="cart-wrapper">
                    <h1 class="cart-title">Your cart</h1>
                    
                    <table class="cart-table" id="cartTable">
                        <thead>
                            <tr>
                                <th class="col-product">Product</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="fullCartBody">
                            </tbody>
                    </table>

                    <div id="empty-state" class="empty-state-container" style="display: none; text-align: center; padding: 40px;">
                        <p style="font-size: 1.2em; margin-bottom: 20px;">Your cart is empty</p>
                        <button class="btn-secondary" onclick="window.location.href='index.html'">Continue shopping</button>
                    </div>

                    <div class="cart-total-section" id="cartTotalSection">
                        <span class="total-label">Total :</span>
                        <span class="total-amount" id="fullCartTotal">RM 0</span>
                    </div>
                </div>

                <div class="cart-action-buttons" id="cartActionButtons">
                    <button class="btn-secondary" onclick="window.location.href='index.html'">Continue shopping</button>
                    <button class="btn-primary" onclick="processFinalCheckout()">Proceed to checkout</button>
                </div>
            </main>

        </div> 

        <script>
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            function renderFullCart() {
                const tbody = document.getElementById('fullCartBody');
                const totalSpan = document.getElementById('fullCartTotal');
                const emptyState = document.getElementById('empty-state');
                const cartTable = document.getElementById('cartTable');
                const totalSection = document.getElementById('cartTotalSection');
                const actionButtons = document.getElementById('cartActionButtons');
                
                if (cart.length === 0) {
                    cartTable.style.display = 'none';
                    totalSection.style.display = 'none';
                    actionButtons.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                cartTable.style.display = 'table';
                totalSection.style.display = 'block'; 
                actionButtons.style.display = 'flex'; 
                emptyState.style.display = 'none';

                let total = 0;
                
                tbody.innerHTML = cart.map((item, index) => {
                    const subtotal = item.price * item.quantity;
                    total += subtotal;
                    
                    return `
                        <tr>
                            <td class="col-product" style="display: flex; align-items: center; gap: 15px;">
                                <img src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=100';" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                                <span class="product-name">${item.name}</span>
                            </td>
                            <td>RM ${item.price.toLocaleString()}</td>
                            <td>
                                <div class="quantity-controls" style="display: flex; align-items: center; gap: 10px;">
                                    <button class="qty-btn" onclick="updateQty(${index}, -1)" style="padding: 5px 10px; cursor: pointer;">-</button>
                                    <input type="text" value="${item.quantity}" readonly class="qty-input" style="width: 40px; text-align: center;">
                                    <button class="qty-btn" onclick="updateQty(${index}, 1)" style="padding: 5px 10px; cursor: pointer;">+</button>
                                </div>
                            </td>
                            <td>RM ${subtotal.toLocaleString()}</td>
                            <td>
                                <button onclick="removeItem(${index})" style="background:none; border:none; color:#e2312b; cursor:pointer; font-size: 1.5em; font-weight: bold;">&times;</button>
                            </td>
                        </tr>
                    `;
                }).join('');
                
                totalSpan.textContent = `RM ${total.toLocaleString()}`;
            }

            function updateQty(index, change) {
                cart[index].quantity += change;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1); 
                }
                localStorage.setItem('cart', JSON.stringify(cart)); 
                renderFullCart(); 
            }

            function removeItem(index) {
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                renderFullCart();
            }

            function processFinalCheckout() {
                if(cart.length === 0) return;
                alert("Order placed successfully! EWT Technology will process your request.");
                cart = []; 
                localStorage.setItem('cart', JSON.stringify(cart));
                window.location.href = 'index.html'; 
            }

            window.addEventListener('storage', function(event) {
                if (event.key === 'cart') {
                    cart = JSON.parse(event.newValue) || [];
                    renderFullCart();
                }
            });

            renderFullCart();
        </script>
    </body>
</html>
