<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="EWT.png">
        <title> EWT Technology - My Profile </title>
    </head>

    <body>
        <div id="sidebar" class="sidebar">
             <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">&times;</a>
             <a href="index.html" onclick="filterProducts('all'); closeSidebar();">🏠 Home</a>
             <a href="#" onclick="filterProducts('all'); closeSidebar();">📦 Products</a>
             <a href="#" onclick="filterProducts('custom'); closeSidebar();">🖥️ Custom PC</a>
             <hr>
             <a href="profilePage.html" onclick="showProfile(); closeSidebar();">👤 My Account</a>
             <a href="#" onclick="logout(); closeSidebar();">🚪 Logout</a>
             <a href="#" onclick="showLogin(); closeSidebar();">🔑 Login</a>
             <a href="#" onclick="showRegister(); closeSidebar();">📝 Register</a>
        </div>

        <div class="header-container">
            <button class="menu-btn" onclick="openSideBar()">☰ Menu</button>
            <div class="logo-center">
                <img src="EWT.png" alt="EWT Logo" style="width: 50px; height: auto;"> 
            </div>
            <a href="javascript:void(0)" onclick="openCart()" class="cart-btn">🛒 Cart</a>
        </div>
        
        <div class="bigPage">
            
            <div class="profileSidebar">
                <div class="profilePic"></div>
                <p class="profileText"> MY PROFILE </p>
    
                <button type="button" class="pSbtn" id="button1" onclick="myAccInfo()">Account Info</button> 
                <button type="button" class="pSbtn" id="button2" onclick="ShopCart()">Shopping Cart</button>
                <button type="button" class="pSbtn" id="button3" onclick="MyOrders()">My Orders</button>
                <button type="button" class="pSbtn" id="button4" onclick="SignOut()">Sign Out</button>
            </div>

            <div class="AccountInfoPage" id="accountSection"> 
                <h2 class="simpleText">MY ACCOUNT INFORMATION</h2>
                <hr>
                <form class="AccountInfoCard" id="accountForm"> 
        
                    <div class="form-group">
                        <label for="username">Username</label> 
                        <input type="text" id="username" name="username" placeholder="Enter username"> 
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter email"> 
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="Enter address">
                    </div>

                    <div class="form-group">
                        <label for="extra-field"></label>
                        <input type="text" id="extra-field" name="extra-field">
                    </div>

                    <button type="submit" class="saveBtn">SAVE</button>
                </form>
            </div>

            <div class="MyOrderPage" id="myOrderSection" style="display: none;"> 
                <h2 class="simpleText">MY ORDERS</h2>
                <hr>
                
                <div class="orderlist">
                    <div class="order-item">
                        <div class="product-image-placeholder"></div>

                        <div class="product-details">
                            <h3 class="product-title">Computer</h3>
                            <p class="product-variant">Blue</p>
                            <p class="product-quantity">1 X</p>
                        </div>
                    </div>
                </div>

                <div class="order-summary-bar">
                    <div class="total-text">TOTAL: </div>
                    <button type="button" class="buy-btn">BUY</button>
                </div>
            </div>
                
        </div>    

        <script>
            function myAccInfo() {
                // Show account details, hide order details
                document.getElementById('accountSection').style.display = 'block';
                document.getElementById('myOrderSection').style.display = 'none';
            }

            function MyOrders() {
                // Hide account details, show order details
                document.getElementById('accountSection').style.display = 'none';
                document.getElementById('myOrderSection').style.display = 'block';
            }

            // --- Updated Navigation Scripts ---
            
            function ShopCart() { 
                window.location.href = 'cart.html'; 
            }
            
            function openCart() { 
                window.location.href = 'cart.html'; 
            }

            function openSideBar() { 
                document.getElementById("sidebar").style.width = "280px"; 
            }

            function closeSidebar() { 
                document.getElementById("sidebar").style.width = "0"; 
            }
            
            function SignOut() { 
                alert('Logged out'); 
            }
        </script>
    </body>
</html>
